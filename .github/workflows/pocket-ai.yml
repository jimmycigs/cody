name: pocket-ai

on:
  push:
    paths:
      - 'pocket-ai/**'
      - '.github/workflows/pocket-ai.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocket-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ai-apk
          path: pocket-ai/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
